<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor MP3</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #0d0d0d;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

/* PARTÍCULAS */
.particles span {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #888;
  border-radius: 50%;
  animation: float 15s linear infinite;
  opacity: 0.4;
}

@keyframes float {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-10vh);
  }
}

/* CONTENEDOR */
.player-box {
  background: #111;
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
  width: fit-content;
  text-align: center;
}

/* BOTONES */
button, select {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #222;
  color: white;
  font-size: 14px;
}

button:hover, select:hover {
  background: #333;
}

/* ECUALIZADOR */
.eq {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 10px;
}

.eq div {
  width: 6px;
  height: 20px;
  background: #aaa;
  animation: eqAnim 1s infinite ease-in-out;
}

.eq div:nth-child(2) { animation-delay: .1s }
.eq div:nth-child(3) { animation-delay: .2s }
.eq div:nth-child(4) { animation-delay: .3s }
.eq div:nth-child(5) { animation-delay: .4s }

@keyframes eqAnim {
  0% { height: 10px }
  50% { height: 30px }
  100% { height: 10px }
}
</style>
</head>

<body>

<div class="particles">
  <span style="left:10%;animation-duration:12s"></span>
  <span style="left:30%;animation-duration:18s"></span>
  <span style="left:50%;animation-duration:14s"></span>
  <span style="left:70%;animation-duration:20s"></span>
  <span style="left:90%;animation-duration:16s"></span>
</div>

<div class="player-box">
  <button onclick="startPlayer()">Iniciar reproductor</button>

  <select id="songList" onchange="changeSong()">
    <option value="">Selecciona una canción</option>
  </select>

  <button onclick="play()">▶ Reproducir</button>
  <button onclick="pause()">⏸ Pausar</button>

  <div class="eq" id="eq" style="display:none">
    <div></div><div></div><div></div><div></div><div></div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const songs = [
  ["1911","1911.mp3"],
  ["De Menores a Mafiosos","De_Menores_a_Mafiosos.mp3"],
  ["Nada Es Igual","Nada_Es_Igual.mp3"],
  ["NADIE","NADIE.mp3"],
  ["Nataaoki","Nataaoki.mp3"],
  ["Netflix and Chill","Netflix_and_Chill.mp3"],
  ["P.V","P.V.mp3"],
  ["Paris Hilton","Paris_Hilton.mp3"],
  ["PAYDAY","PAYDAY.mp3"],
  ["PLAK","PLAK.mp3"],
  ["Por Esos Ojos","Por_Esos_Ojos.mp3"],
  ["putielegante","putielegante.mp3"],
  ["RZR","RZR.mp3"],
  ["Triple Lavada","Triple_Lavada.mp3"],
  ["Exoticón Van Cleef","Exoticon_Van_Cleef.mp3"],
  ["F.E.S","F.E.S.mp3"],
  ["GIMME A SECOND","GIMME_A_SECOND.mp3"],
  ["Jacobo Grinberg","Jacobo_Grinberg.mp3"],
  ["JESSE PINKMAN","JESSE_PINKMAN.mp3"],
  ["Kamikaze","Kamikaze.mp3"],
  ["KFC","KFC.mp3"],
  ["King of Watches","King_of_Watches.mp3"],
  ["LINDA","LINDA.mp3"],
  ["Loco","Loco.mp3"],
  ["LVL","LVL.mp3"],
  ["Mano a Mano","Mano_a_Mano.mp3"],
  ["Marlboro Rojo","Marlboro_Rojo.mp3"],
  ["Me Paseo","Me_Paseo.mp3"],
  ["Mia","Mia.mp3"],
  ["2+2","2+2.mp3"],
  ["ALV Remix","ALV_Remix.mp3"],
  ["Andamos Francos","Andamos_Francos.mp3"],
  ["ayy weyy","ayy_weyy.mp3"],
  ["Cairo","Cairo.mp3"],
  ["Capos","Capos.mp3"],
  ["Cholo","Cholo.mp3"],
  ["Corum","Corum.mp3"],
  ["Don Dimadon","Don_Dimadon.mp3"],
  ["dopamina","dopamina.mp3"],
  ["El Plumas","El_Plumas.mp3"],
  ["El 3","El_3.mp3"],
  ["El Barbas Hats","El_Barbas_Hats.mp3"],
  ["Elecciones","Elecciones.mp3"]
];

const audio = document.getElementById("audio");
const list = document.getElementById("songList");
const eq = document.getElementById("eq");

songs.forEach(song=>{
  const opt = document.createElement("option");
  opt.value = "music/" + song[1];
  opt.textContent = song[0];
  list.appendChild(opt);
});

function startPlayer(){
  alert("Reproductor listo 🔥");
}

function changeSong(){
  audio.src = list.value;
  audio.load();
}

function play(){
  if(audio.src){
    audio.play();
    eq.style.display="flex";
  }
}

function pause(){
  audio.pause();
  eq.style.display="none";
}
</script>

</body>
</html>
