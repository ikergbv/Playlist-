<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor MP3 Reactivo</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #0d0d0d;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

/* PARTÍCULAS */
.particles span {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #888;
  border-radius: 50%;
  animation: float 15s linear infinite;
  opacity: 0.4;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* CONTENEDOR */
.player-box {
  background: #111;
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
  width: 260px;
  text-align: center;
}

/* BOTONES */
button, select, input[type=range] {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #222;
  color: white;
  font-size: 14px;
  outline: none;
}

button:hover, select:hover {
  background: #333;
}

/* BARRA PROGRESO */
input[type=range] {
  padding: 0;
  height: 6px;
  appearance: none;
  background: #444;
  cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #aaa;
}

/* VISUALIZADOR (CANVAS) */
#visualizer {
  width: 100%;
  height: 60px;
  margin-top: 10px;
  display: block;
  /* Ocultamos el visualizador hasta que haya play */
  opacity: 0.5; 
}
</style>
</head>

<body>

<div class="particles">
  <span style="left:10%;animation-duration:12s"></span>
  <span style="left:30%;animation-duration:18s"></span>
  <span style="left:50%;animation-duration:14s"></span>
  <span style="left:70%;animation-duration:20s"></span>
  <span style="left:90%;animation-duration:16s"></span>
</div>

<div class="player-box">
  <button onclick="initAudioContext()">Iniciar sistema de audio</button>

  <select id="songList" onchange="changeSong()">
    <option value="">Selecciona una canción</option>
  </select>

  <input type="range" id="progress" value="0" min="0" max="100">

  <button onclick="play()">▶ Reproducir</button>
  <button onclick="pause()">⏸ Pausar</button>

  <canvas id="visualizer"></canvas>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
const songs = [
  ["1911","1911.mp3"],
  ["De Menores a Mafiosos","De_Menores_a_Mafiosos.mp3"],
  ["Nada Es Igual","Nada_Es_Igual.mp3"],
  ["NADIE","NADIE.mp3"],
  ["Nataaoki","Nataaoki.mp3"],
  ["Netflix and Chill","Netflix_and_Chill.mp3"],
  ["P.V","P.V.mp3"],
  ["Paris Hilton","Paris_Hilton.mp3"],
  ["PAYDAY","PAYDAY.mp3"],
  ["PLAK","PLAK.mp3"],
  ["Por Esos Ojos","Por_Esos_Ojos.mp3"],
  ["putielegante","putielegante.mp3"],
  ["RZR","RZR.mp3"],
  ["Triple Lavada","Triple_Lavada.mp3"],
  ["Exoticón Van Cleef","Exoticon_Van_Cleef.mp3"],
  ["F.E.S","F.E.S.mp3"],
  ["GIMME A SECOND","GIMME_A_SECOND.mp3"],
  ["Jacobo Grinberg","Jacobo_Grinberg.mp3"],
  ["JESSE PINKMAN","JESSE_PINKMAN.mp3"],
  ["Kamikaze","Kamikaze.mp3"],
  ["KFC","KFC.mp3"],
  ["King of Watches","King_of_Watches.mp3"],
  ["LINDA","LINDA.mp3"],
  ["Loco","Loco.mp3"],
  ["LVL","LVL.mp3"],
  ["Mano a Mano","Mano_a_Mano.mp3"],
  ["Marlboro Rojo","Marlboro_Rojo.mp3"],
  ["Me Paseo","Me_Paseo.mp3"],
  ["Mia","Mia.mp3"],
  ["2+2","2+2.mp3"],
  ["ALV Remix","ALV_Remix.mp3"],
  ["Andamos Francos","Andamos_Francos.mp3"],
  ["ayy weyy","ayy_weyy.mp3"],
  ["Cairo","Cairo.mp3"],
  ["Capos","Capos.mp3"],
  ["Cholo","Cholo.mp3"],
  ["Corum","Corum.mp3"],
  ["Don Dimadon","Don_Dimadon.mp3"],
  ["dopamina","dopamina.mp3"],
  ["El Plumas","El_Plumas.mp3"],
  ["El 3","El_3.mp3"],
  ["El Barbas Hats","El_Barbas_Hats.mp3"],
  ["Elecciones","Elecciones.mp3"]
];

const audio = document.getElementById("audio");
const list = document.getElementById("songList");
const progress = document.getElementById("progress");
const canvas = document.getElementById("visualizer");
const canvasCtx = canvas.getContext("2d");

// Variables para el análisis de audio
let audioContext;
let analyser;
let source;
let isAudioContextSetup = false;

// Llenar lista
songs.forEach(song=>{
  const opt = document.createElement("option");
  // Asegúrate que la carpeta "music/" exista y tenga los archivos
  opt.value = "music/" + song[1]; 
  opt.textContent = song[0];
  list.appendChild(opt);
});

// Configuración inicial del AudioContext (requiere interacción del usuario)
function initAudioContext() {
  if (!isAudioContextSetup) {
    // Crear contexto
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    
    // Conectar el audio tag al analizador
    source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    
    // Configuración para que se vea bonito (pocas barras pero gruesas)
    analyser.fftSize = 64; 
    
    isAudioContextSetup = true;
    alert("Sistema de audio activado 🔥. Selecciona una canción y dale Play.");
    
    // Iniciar loop de dibujo
    drawVisualizer();
  } else {
    // Si ya está activo, reanudar si estaba suspendido
    if(audioContext.state === 'suspended') {
      audioContext.resume();
    }
  }
}

function changeSong(){
  audio.src = list.value;
  audio.load();
  progress.value = 0;
  // Si cambiamos canción, intentamos reproducir
  if(isAudioContextSetup) play();
}

function play(){
  if(audio.src){
    // Asegurar que el contexto esté corriendo
    if (audioContext && audioContext.state === 'suspended') {
      audioContext.resume();
    }
    // Si el usuario no presionó "Iniciar sistema" primero, lo intentamos aquí
    if (!isAudioContextSetup) {
      initAudioContext();
    }
    
    audio.play();
  }
}

function pause(){
  audio.pause();
}

/* ACTUALIZAR BARRA */
audio.addEventListener("timeupdate", ()=>{
  if(audio.duration){
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
});

/* MOVER CANCIÓN */
progress.addEventListener("input", ()=>{
  if(audio.duration){
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

/* LÓGICA DE DIBUJO DEL VISUALIZADOR */
function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);

  // Obtener datos de frecuencia
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  // Limpiar el canvas
  canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

  // Configuración de dibujo
  const barWidth = (canvas.width / bufferLength) * 2.5;
  let barHeight;
  let x = 0;

  for (let i = 0; i < bufferLength; i++) {
    barHeight = dataArray[i] / 2; // Ajustar escala de altura

    // Color de las barras (Gris claro)
    canvasCtx.fillStyle = '#aaa'; 
    
    // Dibujar barra
    // (x, y, ancho, alto) -> y se calcula para que crezca desde abajo
    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

    x += barWidth + 2; // Espacio entre barras
  }
}
</script>

</body>
</html>
